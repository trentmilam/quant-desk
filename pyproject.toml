[project]
name = "quant-desk"
version = "0.1.0"
description = "Deterministic, auditable quant math for LLM tool-calling (no-arithmetic-by-LLM dispatch)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quantdesk"]
